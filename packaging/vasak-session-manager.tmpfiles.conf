# Where the greeter remembers who logged in last and which desktop each account
# uses. It needs a directory that outlives a reboot and that the greeter can
# write to: the `greeter` account's home is `/`, which it cannot write to, so
# without this the choice is stored somewhere temporary and forgotten every time
# the machine is turned off.
#
# Only user names and session file names live here — never a password — and only
# the greeter can read them.
d /var/lib/vasak-session-manager 0700 greeter greeter -
