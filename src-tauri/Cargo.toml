[package]
name = "vasak-session-manager"
version = "0.4.0"
description = "VasakOS session manager (display manager / greeter)"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vasak-session-manager"
path = "src/main.rs"

# The lock screen: the same interface as the greeter, over a session that is
# already open. It shares this crate so both really are one screen, and not two
# that drift apart.
[[bin]]
name = "vasak-lock-screen"
path = "src/lock_main.rs"

# Lleva a una cuenta que ya existe las opciones nuevas del paquete, sin pisar lo
# que la persona configuró. `/etc/skel` sólo alcanza a las cuentas nuevas, así que
# sin esto una actualización del escritorio no llega nunca a quien ya lo usaba.
[[bin]]
name = "vasak-config-migrate"
path = "src/config_migrate_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2.189"
tauri-plugin-i18n-vsk = "2.1.1"
tauri-plugin-config-manager = "2"
# Los iconos de las aplicaciones con avisos: hay que resolverlos contra el tema.
tauri-plugin-vicons = "2"
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
pam = "0.8"
zeroize = "1"
# Para leer las notificaciones sin leer y el reproductor. La API bloqueante
# alcanza —son tres consultas puntuales, no un flujo— y así no entra un runtime
# asíncrono entero en una pantalla que tiene que arrancar rápido.
zbus = { version = "4", default-features = false, features = ["blocking", "async-io"] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[dev-dependencies]
tempfile = "3.27.0"
